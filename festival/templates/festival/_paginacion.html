{% if pagina.has_other_pages %}
<nav class="paginacion" aria-label="Paginación">
  {% if pagina.has_previous %}<a class="boton boton-borde" href="?page={{ pagina.previous_page_number }}">← Anterior</a>{% endif %}
  <span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>
  {% if pagina.has_next %}<a class="boton boton-borde" href="?page={{ pagina.next_page_number }}">Siguiente →</a>{% endif %}
</nav>
{% endif %}
